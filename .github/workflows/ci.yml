name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit + structural tests
        run: node --test tests/*.test.mjs
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate manifests (strict)
        run: |
          claude plugin validate . --strict
          for p in plugins/*/; do claude plugin validate "$p" --strict; done
      - name: Install loop (automations, clean config dir)
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude plugin marketplace add ./
          claude plugin install automations@claude-code-setup-optimizer
          claude plugin list | tee list.txt
          grep -q "enabled" list.txt
          ! grep -q "failed to load" list.txt
